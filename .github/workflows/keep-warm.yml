name: Keep backend warm

on:
  schedule:

    - cron: "*/10 * * * *"
  workflow_dispatch: {} 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          url="https://wilpattuvision-production.up.railway.app/health"
          echo "Pinging $url"
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url")
          echo "Response status: $status"
          if [ "$status" -ne 200 ]; then
            echo "Warm-up ping failed with status $status"
            exit 1
          fi
