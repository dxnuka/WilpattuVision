services:
  - type: web
    name: wilpattuvision-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CONFIDENCE_THRESHOLD
        value: "0.60"
    healthCheckPath: /health
